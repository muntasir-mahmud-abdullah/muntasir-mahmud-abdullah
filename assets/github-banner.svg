<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Muntasir Mahmud — Junior MERN Stack Software Engineer</title>
  <desc id="desc">A warm, friendly developer banner greeting visitors, with a short intro, tech stack, a little about me card, location and email.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1226"/>
      <stop offset="0.55" stop-color="#1A1237"/>
      <stop offset="1" stop-color="#2A1240"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="warmV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="20" r="180" fill="#FB7185" opacity="0.18" filter="url(#blur)"/>
  <circle cx="700" cy="340" r="170" fill="#FBBF24" opacity="0.10" filter="url(#blur)"/>
  <circle cx="80" cy="60" r="150" fill="#C084FC" opacity="0.16" filter="url(#blur)"/>
  <rect x="0" y="0" width="8" height="330" rx="4" fill="url(#warmV)"/>

  <!-- Sparkles -->
  <g fill="#FBBF24" opacity="0.85">
    <path transform="translate(718 60)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z"/>
    <path transform="translate(770 112) scale(0.6)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z"/>
  </g>
  <g fill="#FB7185" opacity="0.8">
    <path transform="translate(60 268) scale(0.7)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z"/>
  </g>

  <!-- Monogram -->
  <circle cx="130" cy="150" r="76" fill="url(#warm)" opacity="0.18"/>
  <circle cx="130" cy="150" r="62" fill="#1B1438" stroke="url(#warm)" stroke-width="3"/>
  <text x="130" y="162" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="36" font-weight="700" fill="#FDE68A">MM</text>

  <!-- Intro -->
  <text x="240" y="84" font-family="Georgia,'Times New Roman',serif" font-size="21" font-style="italic" fill="#FDBA74">Hi there, I'm</text>
  <text x="240" y="138" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="48" font-weight="800" fill="#FFF7ED">Muntasir Mahmud</text>
  <path d="M242 154 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="url(#warm)" stroke-width="3" stroke-linecap="round"/>
  <text x="241" y="188" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FBCFE8">Junior MERN Stack Software Engineer</text>
  <text x="241" y="214" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#E9D5FF">I turn ideas into clean, useful web apps,</text>
  <text x="241" y="235" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#E9D5FF">and I love learning something new along the way.</text>

  <!-- Tech chips -->
  <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFF7ED">
    <rect x="240" y="250" width="74" height="28" rx="14" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.6"/>
    <text x="277" y="269">React</text>
    <rect x="324" y="250" width="84" height="28" rx="14" fill="#FB7185" fill-opacity="0.14" stroke="#FB7185" stroke-opacity="0.6"/>
    <text x="366" y="269">Node.js</text>
    <rect x="418" y="250" width="80" height="28" rx="14" fill="#C084FC" fill-opacity="0.16" stroke="#C084FC" stroke-opacity="0.65"/>
    <text x="458" y="269">Express</text>
    <rect x="508" y="250" width="92" height="28" rx="14" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.6"/>
    <text x="554" y="269">MongoDB</text>
    <rect x="610" y="250" width="100" height="28" rx="14" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.6"/>
    <text x="660" y="269">TypeScript</text>
  </g>

  <!-- Footer: location + email -->
  <g fill="none" stroke="#FDBA74" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 296c-3 0-5 2.200-5 5 0 3.600 5 8 5 8s5-4.400 5-8c0-2.800-2-5-5-5z"/>
    <circle cx="247" cy="301" r="1.6"/>
    <rect x="432" y="296" width="14" height="11" rx="2"/>
    <path d="M432 298l7 5 7-5"/>
  </g>
  <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#E9D5FF">
    <text x="262" y="307">Chattogram, Bangladesh</text>
    <text x="454" y="307">muntasirm525@gmail.com</text>
  </g>

  <!-- About me note card -->
  <g transform="rotate(-2 985 160)" filter="url(#shadow)">
    <rect x="824" y="62" width="320" height="196" rx="16" fill="#1F1740" stroke="url(#warm)" stroke-opacity="0.8" stroke-width="1.4"/>
    <text x="850" y="98" font-family="Georgia,'Times New Roman',serif" font-size="20" font-style="italic" font-weight="700" fill="#FDE68A">A little about me</text>
    <path d="M850 106 q12 -6 24 0 t24 0 t24 0 t24 0" fill="none" stroke="url(#warm)" stroke-width="2" stroke-linecap="round"/>
    <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#F5F3FF">
      <circle cx="858" cy="135" r="4" fill="#FBBF24"/>
      <text x="874" y="140">Building full-stack apps with care</text>
      <circle cx="858" cy="165" r="4" fill="#FB7185"/>
      <text x="874" y="170">Learning something new every week</text>
      <circle cx="858" cy="195" r="4" fill="#C084FC"/>
      <text x="874" y="200">Clean code and thoughtful UIs</text>
      <circle cx="858" cy="225" r="4" fill="#2DD4BF"/>
      <text x="874" y="230">Always up for a good chat about code</text>
    </g>
  </g>

  <!-- Sign-off -->
  <text x="1150" y="300" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="17" font-style="italic" fill="#FDBA74">Let's build something great together.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
