<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Muntasir Mahmud — Junior MERN Stack Software Engineer</title>
  <desc id="desc">Developer profile banner with monogram, name, designation, tech stack chips, location, email and a code panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B1A"/>
      <stop offset="0.55" stop-color="#0B1330"/>
      <stop offset="1" stop-color="#150B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7C8FD6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="10" r="170" fill="#D946EF" opacity="0.16" filter="url(#blur)"/>
  <circle cx="760" cy="340" r="170" fill="#22D3EE" opacity="0.12" filter="url(#blur)"/>
  <circle cx="60" cy="40" r="140" fill="#6366F1" opacity="0.14" filter="url(#blur)"/>
  <rect x="0" y="0" width="8" height="330" rx="4" fill="url(#accentV)"/>

  <!-- Monogram -->
  <circle cx="130" cy="165" r="78" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 6"/>
  <circle cx="130" cy="165" r="62" fill="#0D1636" stroke="url(#accent)" stroke-width="3"/>
  <text x="130" y="177" text-anchor="middle" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#E0E7FF">MM</text>

  <!-- Heading -->
  <text x="240" y="98" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3.4" fill="#22D3EE">SOFTWARE ENGINEER  ·  MERN STACK</text>
  <text x="240" y="150" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="800" fill="#F8FAFC">Muntasir Mahmud</text>
  <text x="241" y="185" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="url(#accent)">Junior MERN Stack Software Engineer</text>
  <text x="241" y="218" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="16" fill="#C7D2FE">Building practical, scalable web applications with modern JavaScript.</text>

  <!-- Tech chips -->
  <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#E0E7FF">
    <rect x="240" y="238" width="74" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="277" y="257">React</text>
    <rect x="324" y="238" width="84" height="28" rx="14" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="366" y="257">Node.js</text>
    <rect x="418" y="238" width="80" height="28" rx="14" fill="#818CF8" fill-opacity="0.14" stroke="#818CF8" stroke-opacity="0.6"/>
    <text x="458" y="257">Express</text>
    <rect x="508" y="238" width="92" height="28" rx="14" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.55"/>
    <text x="554" y="257">MongoDB</text>
    <rect x="610" y="238" width="100" height="28" rx="14" fill="#D946EF" fill-opacity="0.12" stroke="#D946EF" stroke-opacity="0.55"/>
    <text x="660" y="257">TypeScript</text>
  </g>

  <!-- Footer: location + email -->
  <rect x="240" y="284" width="470" height="1" fill="#6366F1" fill-opacity="0.3"/>
  <g fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 297c-3 0-5 2.2-5 5 0 3.6 5 8 5 8s5-4.400 5-8c0-2.800-2-5-5-5z"/>
    <circle cx="247" cy="302" r="1.6"/>
    <rect x="432" y="297" width="14" height="11" rx="2"/>
    <path d="M432 299l7 5 7-5"/>
  </g>
  <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#A5B4FC">
    <text x="262" y="308">Chattogram, Bangladesh</text>
    <text x="454" y="308">muntasirm525@gmail.com</text>
  </g>

  <!-- Code panel -->
  <rect x="820" y="64" width="330" height="206" rx="14" fill="#050A18" fill-opacity="0.88" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="1.2"/>
  <circle cx="842" cy="86" r="4.5" fill="#FB7185"/>
  <circle cx="858" cy="86" r="4.5" fill="#FBBF24"/>
  <circle cx="874" cy="86" r="4.5" fill="#34D399"/>
  <text x="1128" y="90" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" fill="#64748B">developer.js</text>
  <rect x="820" y="102" width="330" height="1" fill="#6366F1" fill-opacity="0.3"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#E2E8F0">
    <text x="842" y="128"><tspan fill="#D946EF">const</tspan> <tspan fill="#22D3EE">developer</tspan> <tspan fill="#94A3B8">= {</tspan></text>
    <text x="862" y="152"><tspan fill="#A5B4FC">name:</tspan> <tspan fill="#86EFAC">"Muntasir Mahmud"</tspan>,</text>
    <text x="862" y="174"><tspan fill="#A5B4FC">role:</tspan> <tspan fill="#86EFAC">"MERN Engineer"</tspan>,</text>
    <text x="862" y="196"><tspan fill="#A5B4FC">stack:</tspan> [<tspan fill="#86EFAC">"React"</tspan>, <tspan fill="#86EFAC">"Node.js"</tspan>],</text>
    <text x="862" y="218"><tspan fill="#A5B4FC">db:</tspan> <tspan fill="#86EFAC">"MongoDB"</tspan>,</text>
    <text x="862" y="240"><tspan fill="#A5B4FC">learning:</tspan> <tspan fill="#FBBF24">true</tspan>,</text>
    <text x="842" y="260" fill="#94A3B8">};</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
